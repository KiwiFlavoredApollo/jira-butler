services:
  jira-butler:
    build: .
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
    volumes:
      - jira-butler-data-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jira-butler-data:
